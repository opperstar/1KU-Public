name: Zotero DB lifecycle source-parity qualification

on:
  push:
    branches: [main]
    paths:
      - 'tests/zotero-db-lifecycle-source-parity.mjs'
      - '.github/workflows/zotero-db-lifecycle-source-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Zotero DB lifecycle source-parity qualification
        run: node tests/zotero-db-lifecycle-source-parity.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zotero-db-lifecycle-source-parity-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/zotero-db-lifecycle-source-parity-*.json
          if-no-files-found: error
