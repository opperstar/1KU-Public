name: Zotero row120 node sqlite translation qualification

on:
  push:
    branches: [main]
    paths:
      - 'tests/zotero-row120-network-fs.mjs'
      - '.github/workflows/zotero-row120-network-fs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-node-sqlite-how:
    name: macOS node:sqlite row120 HOW
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run row120 node:sqlite semantic qualification
        env:
          ROW120_NETWORK_FS_KIND: local-macos-substrate
          ROW120_REAL_NETWORK_FS: '0'
        run: node tests/zotero-row120-network-fs.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zotero-row120-macos-node-sqlite-how
          path: tests/zotero-row120-artifacts/*.json
          if-no-files-found: error
