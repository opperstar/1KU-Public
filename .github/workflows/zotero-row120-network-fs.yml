name: Zotero row120 node sqlite translation qualification

on:
  push:
    branches: [main]
    paths:
      - 'tests/zotero-row120-network-fs.mjs'
      - '.github/workflows/zotero-row120-network-fs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-frozen-route:
    name: ${{ matrix.os }} row120 frozen route
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run frozen row120 route qualification
        run: node tests/zotero-row120-network-fs.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zotero-row120-frozen-route-${{ runner.os }}-${{ runner.arch }}
          path: tests/zotero-row120-artifacts/*.json
          if-no-files-found: error
